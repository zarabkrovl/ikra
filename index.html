<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ЧИТАЙ · Женская школа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap">
<style>
:root{
  --bg:#FAF4EA; --ambient:#F3E9DA; --surface:#FEFCF8; --surface-2:#F7F0E4; --surface-3:#EADFCD;
  --ink:#4A3220; --ink-dim:#6B553C; --ink-faint:#7A6446;
  --gold:#B29572;
  --green:#2A4B37; --green-deep:#1D2C1F; --green-soft:#E9EFE8;
  --accent:#2A4B37; --accent-strong:#77593A; --accent-soft:#F4EADA; --accent-ink:#FEFCF8;
  --border:rgba(74,50,32,.08); --border-strong:rgba(178,149,114,.42);
  --shadow:rgba(120,95,65,.10); --ok:#2A4B37; --warn:#8A6B47;
  --mark-ar:#8A6B47; --mark-ru:#4A3220;
  --emboss:rgba(255,255,255,.9); --relief:rgba(120,95,65,.16);
  --r-s:10px; --r-m:16px; --r-l:22px;
  --lat:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%20viewBox='0%200%2040%2040'%3E%3Cg%20fill='none'%20stroke='black'%20stroke-width='1.15'%20stroke-linejoin='round'%3E%3Cpath%20d='M20%201.5L38.5%2020%2020%2038.5%201.5%2020z'/%3E%3Crect%20x='6.6'%20y='6.6'%20width='26.8'%20height='26.8'%20rx='2'/%3E%3Ccircle%20cx='20'%20cy='20'%20r='3.4'/%3E%3Cpath%20d='M20%201.5v5M20%2033.5v5M1.5%2020h5M33.5%2020h5'%20stroke-width='.75'/%3E%3C/g%3E%3C/svg%3E");
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.5 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.ar{font-family:Amiri,serif;direction:rtl}
.dsp{font-family:Manrope,sans-serif;font-weight:600;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{max-width:460px;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg);
  box-shadow:0 0 60px var(--shadow)}
.scroll{padding:0 20px calc(96px + env(safe-area-inset-bottom));}
body.playing .scroll{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid var(--border)}
.topbar .logo{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:none;
  box-shadow:0 1px 4px var(--shadow)}
.topbar h1{margin:0;font:600 15px/1.15 Manrope,sans-serif;letter-spacing:-.01em}
.topbar .sub{font-size:12px;color:var(--ink-dim);line-height:1.3;margin-top:1px}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;
  border:1px solid var(--border);background:var(--surface);transition:transform .15s,background .2s}
.iconbtn:active{transform:scale(.92)}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  max-width:460px;margin:0 auto;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--border)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;
  border-radius:12px;color:var(--ink-dim);font-size:11px;font-weight:600;letter-spacing:.01em;
  transition:color .2s}
.tab svg{width:21px;height:21px;stroke-width:1.7;transition:transform .22s cubic-bezier(.34,1.4,.64,1)}
.tab[aria-selected="true"]{color:var(--accent-strong)}
.tab[aria-selected="true"] svg{transform:translateY(-1px) scale(1.06)}
.tab:active svg{transform:scale(.9)}

/* ---------- typography blocks ---------- */
.sec{margin:32px 0 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 11px}
.sec-h h2{margin:0;font:600 18px/1.2 Manrope,sans-serif;letter-spacing:-.015em}
.sec-h .more{font-size:13px;font-weight:600;color:var(--accent-strong)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);
  padding:14px;box-shadow:0 1px 2px var(--shadow)}
.card+.card{margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase;padding:4px 8px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent-strong)}
.tag.open{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.wait{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:13px;color:var(--ink-dim);margin-top:8px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:13px;height:13px;flex:none;opacity:.75;stroke-width:1.8}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:12px;font-size:14px;font-weight:700;
  background:var(--accent);color:var(--accent-ink);
  transition:transform .14s cubic-bezier(.34,1.4,.64,1),filter .2s;width:100%}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--border-strong)}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:10px;width:auto}
.btn svg{width:16px;height:16px;stroke-width:2}
.btn-row{display:flex;gap:8px;margin-top:12px}

/* ---------- pills/filters ---------- */
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:0;padding:2px 0}
.pill{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--border-strong);
  background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-dim);
  transition:all .18s}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill:active{transform:scale(.95)}

/* ---------- hero ---------- */
.hero{margin:0 -16px;padding:0 24px 20px;text-align:center;position:relative;overflow:hidden;
  background:var(--bg)}
.hero .mark{width:76px;height:76px;border-radius:20px;margin:0 auto 12px;object-fit:cover;
  box-shadow:0 6px 20px var(--shadow)}
.hero h2{margin:0;font:800 25px/1.1 Manrope,sans-serif;letter-spacing:.09em}
.hero .ar{font-size:26px;color:var(--gold);margin:0 0 2px;line-height:1.2}
.hero p{margin:14px auto 0;max-width:30ch;font-size:13.5px;color:var(--ink-dim);line-height:1.45}
.hero .stats{display:flex;justify-content:center;gap:18px;margin-top:14px;font-size:12.5px;color:var(--ink-dim)}
.hero .stats b{display:block;font:600 16px/1.1 Manrope,sans-serif;color:var(--ink)}

/* ---------- match CTA ---------- */
.match{margin-top:16px;padding:16px;border-radius:var(--r-l);position:relative;overflow:hidden;
  background:var(--accent);color:var(--accent-ink);text-align:left;width:100%;display:block;
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 34%,transparent);
  transition:transform .16s cubic-bezier(.34,1.4,.64,1)}
.match:active{transform:scale(.98)}
.match b{display:block;font:600 17px/1.2 Manrope,sans-serif}
.match span{display:block;margin-top:4px;font-size:13px;opacity:.85;max-width:26ch}
.match .arw{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:26px;height:26px;
  border-radius:50%;background:color-mix(in srgb,var(--accent-ink) 20%,transparent);display:grid;place-items:center}

/* ---------- progress ---------- */
.bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);
  transition:width .7s cubic-bezier(.22,.8,.3,1)}
.bar.ok>i{background:var(--ok)}

/* ---------- teachers ---------- */
.trow{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 6px;margin:0;padding:2px 0;align-items:start}
.tcard{width:100%;text-align:center}
.ava{width:62px;height:62px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;
  font:600 22px/1 Manrope,sans-serif;color:var(--accent-ink);background:var(--accent);
  box-shadow:0 3px 10px var(--shadow);transition:transform .16s}
.tcard:active .ava{transform:scale(.93)}
.tcard b{display:block;font-size:12.5px;font-weight:700;line-height:1.25}
.tcard span{display:block;font-size:12px;color:var(--ink-dim);margin-top:2px}

/* ---------- schedule ---------- */
.day{margin-top:16px}
.day-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.day-h b{font:600 15px/1 Manrope,sans-serif}
.day-h .badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.day-h hr{flex:1;border:0;border-top:1px solid var(--border);margin:0}
.slot{display:flex;gap:12px;padding:11px 13px;border-radius:var(--r-m);background:var(--surface);
  border:1px solid var(--border);align-items:flex-start}
.slot+.slot{margin-top:7px}
.slot .time{font:600 14px/1.2 Manrope,sans-serif;color:var(--accent-strong);width:48px;flex:none;
  font-variant-numeric:tabular-nums}
.slot .body b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.slot .body span{display:block;font-size:12.5px;color:var(--ink-dim);margin-top:3px}
.slot.mine{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- lectures / player ---------- */
.lec{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-m);
  background:var(--surface);border:1px solid var(--border)}
.lec+.lec{margin-top:8px}
.play{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent-strong);position:relative;
  transition:transform .16s cubic-bezier(.34,1.4,.64,1)}
.play:active{transform:scale(.9)}
.play svg{width:17px;height:17px}
.lec.done .play{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.lec .info{flex:1;min-width:0}
.lec .info b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.lec .info span{display:block;font-size:12.5px;color:var(--ink-dim);margin-top:3px}
.lec .fav{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink-faint)}
.lec .fav[aria-pressed="true"]{color:var(--accent-strong)}
.lec .fav svg{width:18px;height:18px}
.miniprog{height:3px;border-radius:99px;background:var(--surface-3);margin-top:7px;overflow:hidden}
.miniprog>i{display:block;height:100%;background:var(--accent)}

.player{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:45;
  max-width:460px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;gap:11px;
  background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);transform:translateY(130%);visibility:hidden;
  transition:transform .34s cubic-bezier(.22,.9,.3,1),visibility .34s}
.player.on{transform:translateY(0);visibility:visible}
.player .pp{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;flex:none}
.player .pp svg{width:15px;height:15px}
.player .pi{flex:1;min-width:0}
.player .pi b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.player .pi .t{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;margin-top:2px}
.player .bar{margin-top:5px;height:4px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,14,8,.5);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:460px;margin:0 auto;
  background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--border);border-bottom:0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;
  transform:translateY(102%);transition:transform .38s cubic-bezier(.22,.9,.3,1);
  box-shadow:0 -10px 40px var(--shadow)}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--border-strong);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font:600 20px/1.2 Manrope,sans-serif;letter-spacing:-.015em}
.sheet .lead{font-size:13.5px;color:var(--ink-dim);margin:0 0 16px}
.field{margin-top:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-dim);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border-radius:12px;
  border:1px solid var(--border-strong);background:var(--surface-2);color:var(--ink);
  font:400 14.5px/1.4 Manrope,sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:13px;margin-top:8px;
  border:1px solid var(--border-strong);background:var(--surface-2);font-size:14.5px;font-weight:600;
  transition:all .18s}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.opt:active{transform:scale(.98)}
.steps{display:flex;gap:5px;margin-bottom:14px}
.steps i{flex:1;height:3px;border-radius:99px;background:var(--surface-3)}
.steps i.on{background:var(--accent)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:40px 20px;color:var(--ink-faint);font-size:13.5px}
.empty svg{width:34px;height:34px;margin:0 auto 10px;opacity:.4;display:block}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:99px;font-size:13px;font-weight:600;
  transition:opacity .25s,transform .25s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{font-size:12.75px;color:var(--ink-faint);line-height:1.5}
.divider{height:1px;background:var(--border);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}
.kv+.kv{border-top:1px solid var(--border)}
.kv span{color:var(--ink-dim)}
.kv b{font-weight:700;text-align:right}
.screen{animation:in .3s cubic-bezier(.22,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border-radius:99px;border:1px solid var(--border-strong);color:var(--ink-dim);
  vertical-align:1px;margin-left:6px}

/* ============ СТИЛЬ ПОСТЕРА ШКОЛЫ ============ */
/* заголовки — капсом, как «КОРАН / АРАБСКИЙ ЯЗЫК» на постере */
.sec-h h2{font:700 13.5px/1.25 Manrope,sans-serif;letter-spacing:.09em;text-transform:uppercase}
.sheet h3{font:700 15px/1.3 Manrope,sans-serif;letter-spacing:.07em;text-transform:uppercase}
.caps{font-weight:800;letter-spacing:.05em;text-transform:uppercase}

/* золотая волосяная линейка с розеткой по центру */
.rule{display:flex;align-items:center;gap:9px;color:var(--gold);margin:2px 0 13px}
.rule i{flex:1;height:1px;background:currentColor;opacity:.5}
.rule svg{flex:none;opacity:.85}

/* ромбики вокруг надписи капсом */
.eyebrow{color:var(--ink-dim)}
.eyebrow.dia::before,.eyebrow.dia::after{content:"✦";color:var(--gold);margin:0 7px;font-size:.9em}

/* медальон: кремовый кружок в тонком бронзовом кольце */
.medal{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--gold);color:var(--ink);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--surface) 75%,transparent)}
.medal svg{width:21px;height:21px;stroke-width:1.6}
.ava{background:var(--surface-2);color:var(--ink);border:1px solid var(--gold);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--surface) 75%,transparent);font-weight:700}

/* арка-ниша, как рама постера */
.arch{max-width:290px;margin:0 auto;padding:24px 20px 18px;
  border:1px solid var(--border-strong);border-radius:145px 145px 20px 20px;
  background:linear-gradient(180deg,var(--surface) 10%,transparent 85%)}

/* карточка курса: медальон + капс + тонкий подзаголовок */
.crow{display:flex;gap:13px;align-items:flex-start}
.cname{font:700 13.5px/1.35 Manrope,sans-serif;letter-spacing:.055em;text-transform:uppercase;margin:0}
.csub{font-size:12.5px;color:var(--ink-dim);margin-top:3px;line-height:1.4}

/* метка статуса — контурная пилюля */
.tag{background:transparent;border:1px solid var(--gold);color:var(--accent-strong);
  letter-spacing:.07em;padding:4px 10px}
.tag.open{background:var(--accent-soft);border-color:var(--gold);color:var(--ink)}
.tag.wait{background:transparent;border-style:dashed;border-color:var(--gold);color:var(--accent-strong)}

/* вторичная кнопка — контурная пилюля «ОФЛАЙН | ОНЛАЙН» */
.btn.ghost{background:transparent;border:1px solid var(--gold);border-radius:99px;
  color:var(--ink);font-weight:700;letter-spacing:.01em;font-size:13.5px}
.btn:not(.ghost){border-radius:99px;letter-spacing:.04em}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}

/* ниша с резными боковинами — как рама постера */
.niche{position:relative;margin:0 -24px 0;padding:20px 26px 10px;overflow:hidden;
  background:linear-gradient(180deg,var(--ambient),var(--bg) 88%)}
.lattice{position:absolute;top:-10px;bottom:-10px;width:40px;background:var(--gold);opacity:.3;
  -webkit-mask-size:23px 23px;mask-size:23px 23px;pointer-events:none}
.lattice.l{left:0}
.lattice.r{right:0;transform:scaleX(-1)}
.arch{position:relative;max-width:262px;margin:0 auto;padding:14px 18px 14px;text-align:center;
  border:1px solid var(--gold);border-radius:131px 131px 18px 18px;
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--surface) 55%,transparent),0 10px 26px -10px var(--shadow)}
.rosetop{color:var(--gold);margin:2px 0 6px;opacity:.9;line-height:0}
.rosetop svg{width:19px;height:19px}
.armark{font-family:Amiri,serif;font-size:54px;line-height:1.18;color:var(--mark-ar);
  margin-bottom:4px;text-shadow:0 1px 0 var(--emboss),0 3px 5px var(--relief)}
.wordmark{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:37px;line-height:1.1;
  color:var(--mark-ru);
  text-shadow:0 1px 0 var(--emboss),0 3px 6px var(--relief)}
.hero .eyebrow{margin-top:7px;display:block}

/* ============ ПОСТЕР НА ВСЕХ ЭКРАНАХ ============ */
/* поля-лепнина вдоль всего экрана */
.edge{position:absolute;top:0;bottom:0;width:34px;z-index:0;pointer-events:none;
  background:var(--gold);opacity:.26;
  -webkit-mask-image:var(--lat);mask-image:var(--lat);
  -webkit-mask-size:23px 23px;mask-size:23px 23px}
.edge.l{left:0}
.edge.r{right:0;transform:scaleX(-1)}
/* светлая фаска между лепниной и полем, как на постере */
.bevel{position:absolute;top:0;bottom:0;width:10px;z-index:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,#fff 70%,transparent) 45%,transparent)}
.bevel.l{left:32px}
.bevel.r{right:32px;transform:scaleX(-1)}
/* поле не плоское: мягкий тёплый перелив, как на бумаге постера */
.scroll{background:
  linear-gradient(180deg,color-mix(in srgb,#fff 55%,transparent),transparent 180px),
  radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--ambient) 55%,transparent),transparent 70%)}
.scroll{position:relative;z-index:1}
.topbar{z-index:40}

/* заголовки разделов — по центру, как на постере */
.sec-h{flex-direction:column;align-items:center;text-align:center;gap:3px}
.sec-h h2{font-size:14px}

/* карточки — плашки с аркой сверху и волосяной бронзой внутри */
.card{border-radius:22px 22px 14px 14px;border-color:var(--border-strong);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 16%,transparent),0 7px 20px -14px var(--shadow)}
.slot{border-radius:20px 20px 12px 12px;border-color:var(--border-strong)}
.lec{border-radius:20px 20px 12px 12px;border-color:var(--border-strong)}

/* время в расписании — в кружке-медальоне */
.slot .time{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--gold);font-size:12.5px;
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--surface) 70%,transparent)}
.slot{align-items:center}

/* кнопка воспроизведения — тот же медальон */
.lec .play{background:var(--surface-2);border:1px solid var(--gold);color:var(--ink);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--surface) 70%,transparent)}
.lec.done .play{border-color:var(--ok);color:var(--ok)}

/* активная вкладка — в кремовом кружке */
.tabbar{border-top:1px solid var(--border-strong)}
.tab[aria-selected="true"] svg{background:var(--surface-2);border:1px solid var(--gold);
  border-radius:50%;padding:5px;width:31px;height:31px;margin-bottom:-2px}

/* фильтры капсом */
.pill{letter-spacing:.01em;font-size:12.5px;font-weight:600}

/* главный призыв — плашка с аркой и золотой нитью внутри */
.match{border-radius:24px 24px 16px 16px;background:var(--surface);color:var(--ink);
  border:1px solid var(--border-strong);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 22%,transparent),0 6px 18px -14px var(--shadow)}
.match span{opacity:1;color:var(--ink-dim)}
.match b{letter-spacing:0;font-size:16px;font-weight:700;font-family:Manrope,sans-serif}
.match .arw{border:1px solid var(--gold);background:var(--surface-2);color:var(--accent-strong)}

/* шторка — арка сверху и розетка вместо полоски */
.sheet{border-radius:30px 30px 0 0;border-color:var(--border-strong)}
.grab{width:auto;height:auto;background:none;color:var(--gold);text-align:center;line-height:0;margin:2px auto 12px}

/* пустые экраны — с орнаментом */
.empty svg{opacity:.5}

/* дни недели — тем же капсом и бронзовой нитью */
.day-h b{font:700 14px/1 Manrope,sans-serif;letter-spacing:.005em;color:var(--ink-dim)}
.day-h hr{border-top-color:var(--gold);opacity:.45}
.day-h .badge{background:transparent;border:1px solid var(--gold);color:var(--accent-strong);
  letter-spacing:.09em;padding:3px 9px}

/* ниша шапки берёт ту же решётку */
.lattice{-webkit-mask-image:var(--lat);mask-image:var(--lat)}

/* ============ ЗЕЛЁНЫЙ: ДЕЙСТВИЕ И СТАТУС ============ */
/* бронза остаётся орнаментом, зелёный берёт на себя то, что делают и на что смотрят */
.medal{color:var(--green)}
.slot .time{color:var(--green)}
.lec .play{color:var(--green)}
.lec.done .play{border-color:var(--green);color:var(--green)}
.tab[aria-selected="true"]{color:var(--green)}
.tab[aria-selected="true"] svg{border-color:var(--green)}
.day-h .badge{border-color:var(--green);color:var(--green)}
.tag.open{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.match .arw{border-color:var(--green);color:var(--green)}
.sec-h h2{color:var(--green-deep)}
.bar.ok>i{background:var(--green)}
.empty svg{color:var(--green);opacity:.35}
</style>
</head>

    <div style="flex:1;min-width:0">

function nextDayName(){
  for(let i=1;i<=7;i++){ const d=(today+i)%7; if(lessonsOf(d).length) return DAYS[d].toLowerCase(); }
  return '—';
}

/* ============ РАСПИСАНИЕ ============ */
function lessonsOf(d){
  const out = [];
  COURSES.forEach(c => c.slots.forEach(s => { if(s.d === d) out.push({c, t:s.t}); }));
  return out.sort((a,b) => a.t.padStart(5,'0').localeCompare(b.t.padStart(5,'0')));
}
function slotHTML(s){
  const mine = S.enrolled.includes(s.c.id);
  return `<button class="slot${mine?' mine':''}" style="width:100%;text-align:left" onclick="course('${s.c.id}')">
    <div class="time">${s.t}</div>
    <div class="body">
      <b>${s.c.name}</b>
      <span>${T(s.c.t).name} · каб. ${s.c.room} · ${s.c.len}${mine?' · вы записаны':''}</span>
    </div>
  </button>`;
}
function screenSchedule(){
  const order = [1,2,3,4,5,6,0];
  const onlyMine = S.filter === 'mine';
  const body = order.map(d => {
    let ls = lessonsOf(d);
    if(onlyMine) ls = ls.filter(s => S.enrolled.includes(s.c.id));
    if(!ls.length) return '';
    return `<div class="day">
      <div class="day-h"><b>${DAYS[d]}</b>${d===today?'<span class="badge">сегодня</span>':''}<hr></div>
      ${ls.map(slotHTML).join('')}
    </div>`;
  }).join('');
  return `
  <div class="sec" style="margin-top:16px">
    <div class="sec-h"><h2>Неделя в школе</h2></div>
    <div class="pills">
      <button class="pill" aria-pressed="${!onlyMine}" onclick="setFilter('all')">Все группы</button>
      <button class="pill" aria-pressed="${onlyMine}" onclick="setFilter('mine')">Только мои</button>
    </div>
  </div>
  ${body || `<div class="empty">${ic('cal',34)}Вы ещё никуда не записаны.<br>Откройте «Курсы» и выберите поток.</div>`}
  <div class="card" style="margin-top:20px">
    <div class="meta" style="margin-top:0"><span>${ic('pin')}${ADDR}</span></div>
    <div class="btn-row"><a class="btn ghost" href="${MAPS}" target="_blank" rel="noopener">Открыть карту</a></div>
  </div>`;
}
function setFilter(f){ S.filter = f; save(); render(); }

/* ============ ЭКРАН: КУРСЫ ============ */
const FILTERS = [
  {id:'all',   label:'Все'},
  {id:'open',  label:'Набор открыт'},
  {id:'start', label:'С нуля'},
  {id:'quran', label:'Коран'},
  {id:'tajwid',label:'Таджвид'},
  {id:'online',label:'Онлайн'}
];
function matchFilter(c, f){
  if(f === 'all') return true;
  if(f === 'open') return c.status === 'open';
  if(f === 'online') return /онлайн/i.test(c.mode);
  return (c.tags || []).includes(f);
}
function courseCard(c){
  const st = ST[c.status];
  return `<button class="card" style="width:100%;text-align:left;display:block" onclick="course('${c.id}')">
    <div class="crow">
      <div class="medal">${ic(c.icon || 'book')}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div style="min-width:0">
            <h3 class="cname">${c.name}</h3>
            <div class="csub">${c.sub}</div>
          </div>
          <div style="text-align:right;flex:none">
            <b class="num" style="font:800 15.5px/1.1 Manrope,sans-serif">${money(c.price)}</b>
            <div style="font-size:11px;color:var(--ink-dim);margin-top:2px">${c.per}</div>
          </div>
        </div>
        <div style="margin-top:8px"><span class="tag ${st.c}">${st.t}</span></div>
      </div>
    </div>
    <div class="meta">
      <span>${ic('user')}${T(c.t).name}</span>
      <span>${ic('clock')}${slotsText(c)}</span>
      <span>${ic('door')}каб. ${c.room}</span>
    </div>
    ${c.sadaka ? `<div class="meta"><span style="color:var(--ok)">${ic('heart')}Оплата идёт на садака джария</span></div>` : ''}
    ${S.enrolled.includes(c.id) ? `<div class="meta"><span style="color:var(--accent-strong);font-weight:700">${ic('check')}Вы записаны</span></div>` : ''}
  </button>`;
}
function screenCourses(){
  const f = FILTERS.some(x => x.id === S.filter) ? S.filter : 'all';
  const list = COURSES.filter(c => matchFilter(c, f));
  return `
  <div class="sec" style="margin-top:16px">
    <div class="sec-h"><h2>Курсы школы</h2><span class="eyebrow">${list.length} из ${COURSES.length}</span></div>
    <div class="pills">
      ${FILTERS.map(x => `<button class="pill" aria-pressed="${x.id===f}" onclick="setFilter('${x.id}')">${x.label}</button>`).join('')}
    </div>
  </div>
  <div style="margin-top:12px">
    ${list.length ? list.map(courseCard).join('') : `<div class="empty">${ic('book',34)}По этому фильтру курсов нет.</div>`}
  </div>
  <button class="match" style="margin-top:16px" onclick="wizard()">
    <b>Не знаете, что выбрать?</b>
    <span>Ответьте на три вопроса — подберём поток</span>
    <i class="arw">${ic('arrow',14)}</i>
  </button>`;
}

/* ============ ЭКРАН: УРОКИ ============ */
function lecHTML(l){
  const done = S.heard.includes(l.id);
  const pos = S.pos[l.id] || 0;
  const pct = Math.min(100, pos / l.sec * 100);
  const fav = S.fav.includes(l.id);
  return `<div class="lec${done?' done':''}">
    <button class="play" onclick="playLec('${l.id}')" aria-label="Слушать">${done ? ic('check',17) : ic('play',17)}</button>
    <div class="info" onclick="playLec('${l.id}')">
      <b>${l.name}</b>
      <span>${l.tag} · ${mmss(l.sec)}${pos && !done ? ' · остановились на ' + mmss(pos) : ''} · <a href="https://t.me/iqraskhool/${l.post}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--accent-strong);font-weight:700">в Telegram</a></span>
      ${pos ? `<div class="miniprog"><i style="width:${pct}%"></i></div>` : ''}
    </div>
    <button class="fav" aria-pressed="${fav}" onclick="toggleFav('${l.id}')" aria-label="В избранное">
      <svg viewBox="0 0 24 24" fill="${fav?'currentColor':'none'}" stroke="currentColor" stroke-width="1.7"
        stroke-linejoin="round">${ICON.heart}</svg>
    </button>
  </div>`;
}
const LTAGS = ['Все','Наставления','Имена Аллаха','Дуа','Встречи','Вероучение','Семья и нравы','Календарь','Коран'];
function setLq(v){
  S.lq = v; save(); render();
  const el = document.getElementById('lq');
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function setLf(t){ S.lfilter = t; save(); render(); }
function screenLectures(){
  const q = (S.lq || '').trim().toLowerCase();
  const f = S.lfilter || 'Все';
  const list = LECTURES.filter(l => (f === 'Все' || l.tag === f) && (!q || l.name.toLowerCase().includes(q)));
  return `
  <div class="sec" style="margin-top:16px">
    <div class="sec-h"><h2>Записи уроков</h2>
      <span class="eyebrow">${list.length} из ${LECTURES.length} · прослушано ${S.heard.length}</span></div>
    <div class="field" style="margin-top:0">
      <input id="lq" value="${esc(S.lq || '')}" placeholder="Найти урок — например, тревожно"
        oninput="setLq(this.value)" autocomplete="off">
    </div>
    <div class="pills" style="margin-top:10px">
      ${LTAGS.map(t => `<button class="pill" aria-pressed="${t===f}" onclick="setLf('${t}')">${t}</button>`).join('')}
    </div>
    <p class="note" style="margin:12px 0 0">Урок продолжится с того места, где вы остановились — даже если закрыли приложение.<br>В демо запись отматывается ускоренно, слушать — по ссылке в Telegram.</p>
  </div>
  ${list.length ? list.map(lecHTML).join('') : `<div class="empty">${ic('wave',34)}Ничего не нашлось.<br>Попробуйте другое слово.</div>`}
  <div class="card" style="margin-top:16px;background:var(--surface-2)">
    <b style="font:600 14.5px/1.25 Manrope,sans-serif;display:block">Избранное</b>
    <p class="note" style="margin:5px 0 0">Сохранённые уроки собираются во вкладке «Моё» — их ${S.fav.length}.</p>
  </div>`;
}

/* ============ ЭКРАН: МОЁ ============ */
function screenMine(){
  const mine = COURSES.filter(c => S.enrolled.includes(c.id));
  const favs = LECTURES.filter(l => S.fav.includes(l.id));

  const waits = COURSES.filter(c => S.wait.includes(c.id));
  const totalSec = LECTURES.reduce((a,l) => a + (S.heard.includes(l.id) ? l.sec : (S.pos[l.id] || 0)), 0);

  return `
  <div class="sec" style="margin-top:16px">
    <div class="sec-h"><h2>Моё обучение</h2></div>

      <div class="kv"><span>Курсов</span><b class="num">${mine.length}</b></div>

      <div class="kv"><span>Время в уроках</span><b class="num">${mmss(totalSec)}</b></div>
      <div class="bar ok"><i style="width:${Math.round(S.heard.length / LECTURES.length * 100)}%"></i></div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Мои курсы</h2>${mine.length?`<button class="more" onclick="go('schedule')">Расписание</button>`:''}</div>
    ${mine.length ? mine.map(courseCard).join('') :
      `<div class="empty">${ic('book',34)}Пока ни одной записи.<br>
        <button class="btn sm" style="margin-top:12px" onclick="go('courses')">Выбрать курс</button></div>`}
  </div>

  ${waits.length ? `<div class="sec">
    <div class="sec-h"><h2>Лист ожидания</h2></div>
    ${waits.map(c => `<div class="card">
      <b style="font:600 15px/1.25 Manrope,sans-serif;display:block">${c.name}</b>
      <p class="note" style="margin:5px 0 0">Вы в очереди. Сообщим, как только группа наберётся.</p>
      <div class="bar"><i style="width:${Math.round(waitCount(c.id)/12*100)}%"></i></div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--ink-faint)">
        <span class="num">${waitCount(c.id)} сестёр записалось</span><span class="num">группа от 12</span></div>
    </div>`).join('')}
  </div>` : ''}

  ${started.length ? `<div class="sec">
    <div class="sec-h"><h2>Продолжить</h2></div>
    ${started.map(lecHTML).join('')}
  </div>` : ''}

  <div class="sec">
    <div class="sec-h"><h2>Избранные уроки</h2></div>
    ${favs.length ? favs.map(lecHTML).join('') :
      `<div class="empty">${ic('heart',34)}Сохраняйте уроки сердечком —<br>они соберутся здесь.</div>`}
  </div>

  ${S.apps.length ? `<div class="sec">
    <div class="sec-h"><h2>Мои заявки</h2></div>
    ${S.apps.map(a => `<div class="card">
      <span class="tag open">Принята</span>
      <b style="display:block;margin-top:8px;font:600 15px/1.25 Manrope,sans-serif">${esc(a.course)}</b>
      <p class="note" style="margin:5px 0 0">${esc(a.name)}${a.level?' · '+esc(a.level):''} · ${esc(a.when)}</p>
    </div>`).join('')}

  </div>` : ''}

  <div class="sec">
    <button class="btn ghost" onclick="reset()">Очистить демо-данные</button>
  </div>`;
}
function waitCount(id){ return 7 + (S.wait.includes(id) ? 1 : 0); }
function reset(){ S = Object.assign({}, DEF); save(); go('home'); toast('Демо-данные очищены'); }

/* ============ ШТОРКА ============ */
const sheet = $('#sheet'), scrim = $('#scrim');
function openSheet(html){
  sheet.innerHTML = `<div class="grab">${ROSE}</div>` + html;
  sheet.classList.add('on'); scrim.classList.add('on');
  sheet.scrollTop = 0;
}
function closeSheet(){ sheet.classList.remove('on'); scrim.classList.remove('on'); }
scrim.onclick = closeSheet;
addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

/* ---- карточка курса ---- */
function course(id){
  const c = COURSES.find(x => x.id === id); if(!c) return;

  openSheet(`
    <span class="tag ${st.c}">${st.t}</span>

    <div class="kv"><span>Условия</span><b style="font-weight:600;max-width:60%">${c.cond}</b></div>

    ${c.free ? `<p class="note" style="margin:12px 0 0">Для тех, у кого нет возможности, — уроки БисмиЛлях.

/* ---- лист ожидания ---- */
function joinWait(id){
  if(!S.wait.includes(id)) S.wait.push(id);
  save(); closeSheet(); render();
  toast('Вы в листе ожидания — сообщим, когда группа наберётся');
}

      <div class="btn-row" style="flex-direction:column">
        <button class="btn" type="submit">Отправить заявку</button>
        <button class="btn ghost" type="button" onclick="closeSheet()">Отмена</button>
      </div>
      <p class="note" style="margin:12px 0 0;text-align:center">Заявка придёт школе списком.
        Не нужно искать, кому писать.</p>
    </form>
  `);
  setTimeout(() => sheet.querySelector('input')?.focus(), 380);
}
function submitEnroll(e, id){
  e.preventDefault();
  const f = new FormData(e.target);
  const c = id === 'event' ? null : COURSES.find(x => x.id === id);
  S.apps.unshift({
    course: c ? c.name : EVENT.title,
    name: f.get('name'),
    level: f.get('level') || '',
    when: c ? slotsText(c) : EVENT.date + ', ' + EVENT.time
  });
  if(c && !S.enrolled.includes(c.id)) S.enrolled.push(c.id);
  save(); closeSheet(); render();
  toast('Заявка отправлена, ин ша Аллах');
}

/* ============ ПОДБОР КУРСА ============ */
const Q = [
  {q:'Читаете ли вы Коран?', a:['Совсем не читаю','Читаю, но с ошибками','Читаю уверенно']},
  {q:'Когда вам удобно заниматься?', a:['Утром в будни','Днём в будни','По выходным']},
  {q:'Как вам удобнее?', a:['Очно в Махачкале','Только онлайн']}
];
let qa = [];
function wizard(step){
  step = step || 0;
  if(step === 0) qa = [];
  if(step >= Q.length) return wizardResult();
  const s = Q[step];
  openSheet(`
    <div class="steps">${Q.map((_,i) => `<i class="${i<=step?'on':''}"></i>`).join('')}</div>
    <h3>${s.q}</h3>
    <p class="lead">Вопрос ${step+1} из ${Q.length}</p>
    ${s.a.map((a,i) => `<button class="opt" onclick="answer(${step},${i})">${a}</button>`).join('')}
    ${step ? `<div class="btn-row"><button class="btn ghost" onclick="wizard(${step-1})">Назад</button></div>` : ''}
  `);
}
function answer(step, i){ qa[step] = i; wizard(step + 1); }
function wizardResult(){
  const [lvl, when, mode] = qa;
  const scored = COURSES.map(c => {
    let s = 0;
    if(mode === 1 && !/онлайн/i.test(c.mode)) return {c, s:-99};
    if(lvl === 0) s += c.level === 'С нуля' ? 4 : (c.level === 'Для всех' ? 1 : -3);
    if(lvl === 1) s += c.level === 'Продолжающие' ? 3 : (c.level === 'С нуля' ? 1 : 2);
    if(lvl === 2) s += (c.tags || []).includes('hifz') ? 4 : (c.level === 'Продолжающие' ? 2 : 1);
    const wk = c.slots.some(x => x.d === 6 || x.d === 0);
    const morn = c.slots.some(x => parseInt(x.t) < 12 && x.d >= 1 && x.d <= 5);
    const day = c.slots.some(x => parseInt(x.t) >= 12 && x.d >= 1 && x.d <= 5);
    if(when === 0 && morn) s += 3;
    if(when === 1 && day) s += 3;
    if(when === 2 && wk) s += 3;
    if(c.status === 'open') s += 2;
    if(c.status === 'waitlist') s -= 1;
    return {c, s};
  }).filter(x => x.s > -50).sort((a,b) => b.s - a.s);

  const top = scored.slice(0, 2).map(x => x.c);
  openSheet(`
    <div class="steps">${Q.map(() => '<i class="on"></i>').join('')}</div>
    <h3>${top.length ? 'Вам подойдёт' : 'Точного совпадения нет'}</h3>
    <p class="lead">${top.length
      ? 'По вашим ответам — вот что ближе всего. Можно открыть карточку и записаться.'
      : 'Из того, что есть сейчас, ничего не совпало полностью. Напишите школе — подскажут.'}</p>
    ${top.map((c, i) => `
      <div class="card" style="${i?'margin-top:10px':''}">
        ${i === 0 ? '<span class="tag">Лучше всего подходит</span>' : '<span class="tag">Тоже вариант</span>'}
        <h4 style="margin:9px 0 2px;font:600 16px/1.2 Manrope,sans-serif">${c.name}</h4>
        <div class="meta" style="margin-top:6px">
          <span>${ic('user')}${T(c.t).name}</span>
          <span>${ic('clock')}${slotsText(c)}</span>
          <span>${ic('money')}${money(c.price)} ${c.per}</span>
        </div>
        <div class="btn-row"><button class="btn sm" style="flex:1" onclick="course('${c.id}')">Открыть курс</button></div>
      </div>`).join('')}
    <div class="btn-row" style="flex-direction:column">
      <button class="btn ghost" onclick="wizard(0)">Пройти заново</button>
      <button class="btn ghost" onclick="closeSheet();go('courses')">Все курсы</button>
    </div>
  `);
}

/* ============ ПЛЕЕР ============ */
let curLec = null, tick = null, playing = false;
const player = $('#player');
function playLec(id){
  if(curLec === id){ togglePlay(); return; }
  curLec = id; playing = true; paint(); start();
  player.classList.add('on'); document.body.classList.add('playing');
}
function start(){
  clearInterval(tick);
  tick = setInterval(() => {
    if(!playing || !curLec) return;
    const l = LECTURES.find(x => x.id === curLec);
    const p = Math.min(l.sec, (S.pos[l.id] || 0) + 5);
    S.pos[l.id] = p;
    if(p >= l.sec){
      if(!S.heard.includes(l.id)) S.heard.push(l.id);
      playing = false; clearInterval(tick); save(); paint(); render();
      toast('Урок прослушан');
      return;
    }
    save(); paint();
  }, 500);
}
function togglePlay(){ playing = !playing; paint(); if(playing) start(); }
function paint(){
  if(!curLec) return;
  const l = LECTURES.find(x => x.id === curLec), p = S.pos[l.id] || 0;
  $('#pTitle').textContent = l.name;
  $('#pNow').textContent = mmss(p);
  $('#pLen').textContent = mmss(l.sec);
  $('#pBar').style.width = (p / l.sec * 100) + '%';
  $('#ppBtn').innerHTML = playing ? ic('pause',15) : ic('play',15);
}
$('#ppBtn').onclick = togglePlay;
$('#pClose').onclick = () => { playing = false; clearInterval(tick); curLec = null;
  player.classList.remove('on'); document.body.classList.remove('playing'); render(); };
function toggleFav(id){
  const i = S.fav.indexOf(id);
  if(i < 0){ S.fav.push(id); toast('Сохранено в избранное'); } else S.fav.splice(i, 1);
  save(); render();
}

/* ============ РЕНДЕР ============ */
function render(){
  const map = {home:screenHome, courses:screenCourses, schedule:screenSchedule,
    lectures:screenLectures, mine:screenMine};
  view.innerHTML = `<div class="screen">${(map[S.tab] || screenHome)()}</div>`;
  view.querySelectorAll('.sec-h').forEach(el => el.insertAdjacentHTML('afterend', RULE));
}
document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === S.tab)));
render();
</script>
